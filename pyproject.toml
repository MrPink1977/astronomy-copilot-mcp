[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-copilot-mcp"
version = "0.1.0"
description = "A safety-controlled Astronomy Copilot MCP alongside the upstream NINA compatibility server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.12,<4",
    "fastapi>=0.116,<1",
    "fastmcp>=3.4.5,<4",
    "pydantic>=2.11,<3",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.1,<2",
    "pytz>=2025.2",
    "requests>=2.32,<3",
    "structlog>=25.4,<27",
    "typing-extensions>=4.14,<5",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = ["alerter", "events", "nina_advanced_mcp", "ts_db"]

[tool.setuptools.packages.find]
include = ["astronomy_copilot*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "unit: deterministic tests with no HTTP server",
    "contract: MCP surface and schema compatibility tests",
    "integration: tests against the local mock NINA HTTP server",
    "hardware: explicitly opted-in tests that may access observatory hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"
include = [
    "astronomy_copilot/**/*.py",
    "test_weather.py",
    "tests/contract/**/*.py",
    "tests/integration/**/*.py",
    "tests/support/**/*.py",
    "tests/test_curated_status.py",
    "tests/test_phase4_actions.py",
    "tests/hardware_integration/**/*.py",
]
extend-exclude = [
    "alerter.py",
    "events.py",
    "nina_advanced_mcp.py",
    "ts_db.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
